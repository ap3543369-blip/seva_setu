services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodshare
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  ecoai:
    build: ./ecoai
    environment:
      ECOAI_KEY: change-me

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ecoai:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/foodshare?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root
      ECOAI_URL: http://ecoai:5001
      ECOAI_KEY: change-me
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  dbdata:
  uploads:
