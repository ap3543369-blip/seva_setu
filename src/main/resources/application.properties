spring.application.name=foodshare
server.port=8080

# --- Database: file based H2 (data survives restarts). Swap for MySQL/PostgreSQL, see README ---
spring.datasource.url=jdbc:h2:file:./data/foodshare;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Uploads (donation photos) ---
foodshare.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=22MB

# --- Session cookie ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Never leak stack traces to the browser
server.error.include-stacktrace=never

# --- EcoAI forecast service (Python, see ecoai/service.py). Set a key on both sides to protect it. ---
ecoai.url=http://127.0.0.1:5001
ecoai.key=

# NGO registration certificates are stored here, outside the public /uploads folder
sevasetu.private-dir=private-docs
