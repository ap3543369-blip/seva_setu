# Activate with: --spring.profiles.active=mysql   (used by docker-compose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodshare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
